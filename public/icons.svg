<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <!-- Bubble Letter Main Gradient -->
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="85%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- 3D Bottom Depth Gradient -->
    <linearGradient id="depthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Subtle Crossword Grid Lines in Background -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="4">
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
  </g>

  <!-- Outer Icon Border Glow -->
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="6"/>

  <!-- Chunky Bubble "WS" Group -->
  <g filter="url(#dropShadow)">
    <!-- 3D Underlay for "W" and "S" -->
    <!-- 'W' 3D Base -->
    <path d="M 88 178 C 88 152 118 140 136 158 L 172 268 L 198 178 C 204 158 232 158 238 178 L 264 268 L 300 158 C 318 140 348 152 348 178 L 316 338 C 310 366 274 374 256 352 L 218 296 L 180 352 C 162 374 126 366 120 338 Z"
          fill="url(#depthGrad)" transform="translate(0, 14)"/>

    <!-- 'S' 3D Base -->
    <path d="M 416 196 C 416 166 386 142 346 146 C 302 150 286 182 290 214 C 294 246 322 260 362 274 C 404 288 418 306 414 336 C 410 372 372 396 324 392 C 286 388 266 366 268 340 C 270 320 292 312 308 324 C 322 334 340 346 364 346 C 382 346 392 336 392 322 C 392 306 376 296 342 284 C 298 268 266 248 268 206 C 270 162 310 132 360 130 C 404 128 438 156 438 190 C 438 208 416 216 416 196 Z"
          fill="url(#depthGrad)" transform="translate(0, 14)"/>

    <!-- Front Bubble Letter 'W' -->
    <path d="M 88 178 C 88 152 118 140 136 158 L 172 268 L 198 178 C 204 158 232 158 238 178 L 264 268 L 300 158 C 318 140 348 152 348 178 L 316 338 C 310 366 274 374 256 352 L 218 296 L 180 352 C 162 374 126 366 120 338 Z"
          fill="url(#bubbleGrad)" stroke="#78350f" stroke-width="8" stroke-linejoin="round"/>

    <!-- Front Bubble Letter 'S' (Overlapping) -->
    <path d="M 416 196 C 416 166 386 142 346 146 C 302 150 286 182 290 214 C 294 246 322 260 362 274 C 404 288 418 306 414 336 C 410 372 372 396 324 392 C 286 388 266 366 268 340 C 270 320 292 312 308 324 C 322 334 340 346 364 346 C 382 346 392 336 392 322 C 392 306 376 296 342 284 C 298 268 266 248 268 206 C 270 162 310 132 360 130 C 404 128 438 156 438 190 C 438 208 416 216 416 196 Z"
          fill="url(#bubbleGrad)" stroke="#78350f" stroke-width="8" stroke-linejoin="round"/>

    <!-- Specular Bubble Highlights (Gloss Shines) -->
    <!-- W Left Shine -->
    <path d="M 112 186 C 112 174 124 168 132 176 L 152 238 C 154 246 146 254 138 250 C 130 246 112 202 112 186 Z" fill="#ffffff" opacity="0.75"/>
    <circle cx="120" cy="180" r="7" fill="#ffffff" opacity="0.9"/>

    <!-- W Right Peak Shine -->
    <path d="M 288 186 C 288 174 298 168 306 176 L 314 216 C 316 224 308 230 302 226 C 296 222 288 200 288 186 Z" fill="#ffffff" opacity="0.7"/>

    <!-- S Top Arch Shine -->
    <path d="M 334 162 C 354 158 382 166 392 180 C 396 186 390 192 382 190 C 368 184 344 180 330 180 C 322 180 322 164 334 162 Z" fill="#ffffff" opacity="0.8"/>
    <circle cx="400" cy="184" r="6" fill="#ffffff" opacity="0.95"/>

    <!-- S Bottom Loop Shine -->
    <path d="M 346 366 C 374 366 388 352 388 336 C 388 330 396 326 400 332 C 404 346 390 376 350 376 C 338 376 338 366 346 366 Z" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
